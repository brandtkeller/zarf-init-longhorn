package:
  create:
    architecture: amd64
    set:
      # The image reference to use for the Zarf agent.
      agent_image_domain: ghcr.io/
      agent_image: zarf-dev/zarf/agent
      # renovate: datasource=docker depName=ghcr.io/zarf-dev/zarf/agent
      agent_image_tag: v0.86.0

      # Images used by both the seed and permanent Zarf registries.
      registry_image_domain: ""
      registry_image: library/registry
      # renovate: datasource=docker depName=registry
      registry_image_tag: 3.1.1
      proxy_image_domain: ""
      proxy_image: alpine/socat
      # renovate: datasource=docker depName=alpine/socat
      proxy_image_tag: 1.8.0.3

      # Required while composing the upstream init package, even though this
      # package does not install its optional Git server component.
      gitea_image: ghcr.io/go-gitea/gitea:1.27.3-rootless